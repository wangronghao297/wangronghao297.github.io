<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="./styles.css?v=site-bg-1" />

    <header class="site-header">

      </a>

      <nav class="site-nav" aria-label="主要导航">

      <a id="mail-link" href="mailto:hello@example.com">联系我</a>
